name: Notificar Release no Discord

on:
  release:
    types: [published]
  workflow_dispatch: # Adicionado para permitir testes manuais

jobs:
  discord-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensagem personalizada
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: "📢 **Nova Release do Hunter Launcher Disponível!** @everyone \nConfiram as novidades que acabaram de sair direto do forno!"
          embed-title: "🚀 ${{ github.event.release.name || 'Teste Manual' }} (${{ github.event.release.tag_name || 'v.Teste' }})"
          embed-description: ${{ github.event.release.body || 'Descrição gerada por gatilho manual.' }}
          embed-url: ${{ github.event.release.html_url || 'https://github.com/CaioMonteir0/Hunter-Launcher' }}
          embed-color: "3447003" 
          embed-author-name: "Hunter Launcher Updates"